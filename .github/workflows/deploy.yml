name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm install
      - name: Run quality checks
        run: npm run typecheck && npm run lint
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://bernydotjar.github.io/Eduardo_Sacahui_Resume
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ github.repository_owner }}.github.io
      - name: Ensure _next assets are served
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
